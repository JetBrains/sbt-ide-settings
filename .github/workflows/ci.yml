name: sbt-ide-settings build & run scripted tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build_and_publish_local:
    name: sbt-ide-settings plugin Build & Run Scripted Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Run scripted tests
        if: matrix.java == 17
        run: sbt +scripted
      - name: Run modern scripted lanes
        if: matrix.java != 17
        run: sbt '++2.12.21' scripted '++3.9.0' scripted
